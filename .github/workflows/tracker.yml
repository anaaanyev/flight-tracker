name: flight-tracker

on:
  schedule:
    - cron: "*/15 * * * *"   # раз в 15 минут: разбор команд Telegram + плановые проверки цен
  workflow_dispatch:
    inputs:
      force_check:
        description: "Проверить цены прямо сейчас"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: flight-tracker
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}   # свежий main даже при «Re-run»

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run tracker
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TP_TOKEN: ${{ secrets.TP_TOKEN }}
          FORCE_CHECK: ${{ github.event_name == 'workflow_dispatch' && inputs.force_check && '1' || '0' }}
        run: python tracker.py

      - name: Save state
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "flight-tracker-bot"
            git config user.email "bot@users.noreply.github.com"
            git add state.json
            git commit -m "state update"
            git push
          fi
